<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Immortail™ — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1A1208;
      color: #F5EDD8;
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .paw { font-size: 4rem; margin-bottom: 1.5rem; animation: pulse 2s ease-in-out infinite; }
    h1 { font-size: 2rem; color: #C9A84C; margin-bottom: 0.75rem; }
    p  { color: #8C7A5E; font-size: 1rem; line-height: 1.6; max-width: 360px; }
    .sub { margin-top: 1rem; font-size: 0.85rem; color: #6B5435; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.6} }
  </style>
</head>
<body>
  <div class="paw">🐾</div>
  <h1>Immortail™</h1>
  <p>You're currently offline, but their memory lives on in your heart.</p>
  <p class="sub">Reconnect to continue your experience.</p>
</body>
</html>
